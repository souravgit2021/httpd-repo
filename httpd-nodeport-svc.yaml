apiVersion: v1
kind: Service
metadata:
  name: httpd-service
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  type: NodePort
  selector:
    app: frontend  # Must match the Deployment's labels
  ports:
    - port: 80        # Port the service listens on inside the cluster
      targetPort: 80  # Port the container is listening on
      nodePort: 30080 # Port exposed on the host node (range: 30000-32767)
