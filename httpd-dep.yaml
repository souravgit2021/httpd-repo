apiVersion: apps/v1
kind: Deployment
metadata:
    name: demo-httpd-deployment
spec:
  replicas: 2
  selector:
      matchLabels:
            app: frontend
  template:
     metadata:
         labels:
            app: frontend
     spec:
       containers:
            - name: c01
              image: httpd
              ports:
                - containerPort: 80
